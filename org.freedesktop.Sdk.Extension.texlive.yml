id: org.freedesktop.Sdk.Extension.texlive
branch: '26.08'
runtime: org.freedesktop.Sdk
build-extension: true
sdk: org.freedesktop.Sdk
runtime-version: '26.08'
appstream-compose: false
separate-locales: false
build-options:
  prefix: /usr/lib/sdk/texlive
  prepend-path: /usr/lib/sdk/texlive/bin
  arch:
    aarch64:
      prepend-path: /usr/lib/sdk/texlive/bin/aarch64-linux
    x86_64:
      prepend-path: /usr/lib/sdk/texlive/bin/x86_64-linux
modules:
  - name: texlive-texmf
    buildsystem: simple
    build-commands:
      - tar --exclude=texmf-dist/doc -xf texlive-texmf.tar.xz -C ${FLATPAK_DEST} --strip-components=1
    sources:
      - type: file
        url: https://ftp.tu-chemnitz.de/pub/tug/historic/systems/texlive/2026/texlive-20260301-texmf.tar.xz
        sha512: 0b8f87622e4b9e31d4bd8c7720376aa9685e5ee299c896e3e1660459546a31e11508946f2c40a71671944c8b467483e5d4d859ff17698d239c7d5aced65d4a6b
        dest-filename: texlive-texmf.tar.xz
  - name: texlive-source
    builddir: true
    build-options:
      ldflags: -ldl
    config-opts:
      - --bindir=${FLATPAK_DEST}/bin/${FLATPAK_ARCH}-linux
      - --datarootdir=${FLATPAK_DEST}
      - --disable-hitex # hitex had to be disabled for texlive 2026
      - --disable-native-texlive-build
      - --disable-xetex # disable xetex to avoid patching, see https://sourceforge.net/p/xetex/bugs/205/
      - --with-banner-add= - Flatpak
      - --without-x # needs additonal dependencies
      - --with-system-cairo
      - --with-system-fontconfig
      - --with-system-freetype2
      - --with-system-gmp
      - --with-system-graphite2
      - --with-system-harfbuzz
      - --with-system-icu
      - --with-system-libpng
      - --with-system-pixman
      - --with-system-zlib
    post-install:
      - make texlinks
      - install -Dm644 ../texk/tests/TeXLive/* -t ${FLATPAK_DEST}/tlpkg/TeXLive/
      - tar -xf ../texlive-extra.tar.gz -C ${FLATPAK_DEST}/tlpkg
      - mktexlsr
      - fmtutil-sys --no-strict --all # had to be adapted due to the missing hitex
    sources:
      - type: archive
        url: https://ftp.tu-chemnitz.de/pub/tug/historic/systems/texlive/2026/texlive-20260301-source.tar.xz
        sha512: c2ea189fee82475e3013e5e6d7bdbbeef80fe33d3636b99b35bf7c8d0ff06b48dcc54d12f4c3959a0fc9e24b80f9c4878a417d4b55ef4880ff238aefbcf189a3
      - type: file
        url: https://ftp.tu-chemnitz.de/pub/tug/historic/systems/texlive/2026/texlive-20260301-extra.tar.xz
        sha512: bde992edb7cbaa119c79bfc73697203dfb6bb7d04488d8e50085c06ebbe241f9ef3d161afb996a814c3d1e35bc2cbfe6a957beb5dfcdcfcc7e0cc827b32c5fc3
        dest-filename: texlive-extra.tar.gz
  - name: perl
    no-autogen: true
    config-opts:
      - -des
      - -Duseshrplib
    build-options:
      cflags: -fPIC
      ldflags: -fpic
    sources:
      - type: archive
        url: https://www.cpan.org/src/5.0/perl-5.42.0.tar.gz
        sha256: e093ef184d7f9a1b9797e2465296f55510adb6dab8842b0c3ed53329663096dc
      - type: script
        dest-filename: configure
        commands:
          - exec ./configure.gnu $@
    post-install:
      - chmod -R u+w $FLATPAK_DEST/lib/perl5
  - name: perl-libs
    buildsystem: simple
    build-commands:
      - perl-libs/install.sh
    post-install:
      - chmod -Rf u+w $FLATPAK_DEST/lib/perl5/site_perl
    sources:
      - org.freedesktop.Sdk.Extension.texlive.perllibs.yml
  - name: biber
    buildsystem: simple
    build-commands:
      - perl ./Build.PL
      - ./Build
      - tar -xf biblatex.tds.tgz -C ${FLATPAK_DEST}/texmf-dist
      - texhash
      - ./Build --output=${FLATPAK_DEST} install
    sources:
      - type: archive
        url: https://github.com/plk/biber/archive/v2.21/biber-2.21.tar.gz
        sha256: 2652cf3ae0abff5fb233aa77f18e70014cc2c70b94a8693c099a3cad9bbb4b20
      - type: file
        url: https://github.com/plk/biblatex/archive/v3.21/biblatex-3.21.tar.gz
        sha256: 8dfbd8e6f75650740066d7b25f3e8c527169febb3c70eb70c337d2f1bb157e3a
        dest-filename: biblatex.tds.tgz        
  - name: appdata
    buildsystem: simple
    build-commands:
      - install -Dm644 ${FLATPAK_ID}.appdata.xml -t ${FLATPAK_DEST}/share/appdata/
    sources:
      - type: file
        path: org.freedesktop.Sdk.Extension.texlive.appdata.xml
  - name: scripts
    buildsystem: simple
    build-commands:
      - cp *.sh /usr/lib/sdk/texlive/
    sources:
      - type: script
        commands:
          - install -dm755 ${FLATPAK_DEST}
          - cp -ra /usr/lib/sdk/texlive/* ${FLATPAK_DEST}
        dest-filename: install.sh
      - type: script
        commands:
          - export PATH=/usr/lib/sdk/texlive/bin/aarch64-linux:/usr/lib/sdk/texlive/bin:$PATH
        dest-filename: enable.sh
        only-arches:
          - aarch64
      - type: script
        commands:
          - export PATH=/usr/lib/sdk/texlive/bin/x86_64-linux:/usr/lib/sdk/texlive/bin:$PATH
        dest-filename: enable.sh
        only-arches:
          - x86_64
