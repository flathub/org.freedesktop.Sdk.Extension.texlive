id: org.freedesktop.Sdk.Extension.texlive
branch: '25.08'
runtime: org.freedesktop.Sdk
build-extension: true
sdk: org.freedesktop.Sdk
runtime-version: '25.08'
appstream-compose: false
separate-locales: false
build-options:
  prefix: /usr/lib/sdk/texlive
  prepend-path: /usr/lib/sdk/texlive/bin
  arch:
    aarch64:
      prepend-path: /usr/lib/sdk/texlive/bin/aarch64-linux
    x86_64:
      prepend-path: /usr/lib/sdk/texlive/bin/x86_64-linux
modules:
  - name: texlive-texmf
    buildsystem: simple
    build-commands:
      - tar -xf texlive-texmf.tar.xz -C ${FLATPAK_DEST} --strip-components=1
    sources:
      - type: file
        url: https://ftp.tu-chemnitz.de/pub/tug/historic/systems/texlive/2025/texlive-20250308-texmf.tar.xz
        sha256: 08dcda7430bf0d2f6ebb326f1e197e1473d3f7cc0984a2adb7236df45316c7cf
        dest-filename: texlive-texmf.tar.xz
  - name: texlive-source
    builddir: true
    build-options:
      ldflags: -ldl
    config-opts:
      - --bindir=${FLATPAK_DEST}/bin/${FLATPAK_ARCH}-linux
      - --disable-native-texlive-build
      - --with-banner-add= - Flatpak
      - --without-x # needs additonal dependencies
      - --with-system-cairo
      - --with-system-fontconfig
      - --with-system-freetype2
      - --with-system-gmp
      - --with-system-graphite2
      - --with-system-harfbuzz
      - --with-system-icu
      - --with-system-libpng
      - --with-system-pixman
      - --with-system-zlib
    post-install:
      - make texlinks
      - install -Dm644 ../texk/tests/TeXLive/* -t ${FLATPAK_DEST}/tlpkg/TeXLive/
      - tar -xf ../texlive-extra.tar.gz -C ${FLATPAK_DEST}/tlpkg
      - mktexlsr
      - fmtutil-sys --all
    sources:
      - type: archive
        url: https://ftp.tu-chemnitz.de/pub/tug/historic/systems/texlive/2025/texlive-20250308-source.tar.xz
        sha256: fffdb1a3d143c177a4398a2229a40d6a88f18098e5f6dcfd57648c9f2417490f
      - type: file
        url: https://ftp.tu-chemnitz.de/pub/tug/historic/systems/texlive/2025/texlive-20250308-extra.tar.xz
        sha256: ea69cfecbc9b138acbc45476e8cb4d9357f5e4e45fd12b3bf9ceabbebd7669d2
        dest-filename: texlive-extra.tar.gz
  - name: perl
    no-autogen: true
    config-opts:
      - -des
      - -Duseshrplib
    build-options:
      cflags: -fPIC
      ldflags: -fpic
    sources:
      - type: archive
        url: https://www.cpan.org/src/5.0/perl-5.40.1.tar.gz
        sha256: 02f8c45bb379ed0c3de7514fad48c714fd46be8f0b536bfd5320050165a1ee26
      - type: script
        dest-filename: configure
        commands:
          - exec ./configure.gnu $@
    post-install:
      - chmod -R u+w $FLATPAK_DEST/lib/perl5
  - name: perl-libs
    buildsystem: simple
    build-commands:
      - perl-libs/install.sh
    post-install:
      - chmod -Rf u+w $FLATPAK_DEST/lib/perl5/site_perl
    sources:
      - org.freedesktop.Sdk.Extension.texlive.perllibs.yml
  - name: biber
    buildsystem: simple
    build-commands:
      - perl ./Build.PL
      - ./Build
      - tar -xf biblatex.tds.tgz -C ${FLATPAK_DEST}/texmf-dist
      - texhash
      - ./Build --output=${FLATPAK_DEST} install
    sources:
      - type: archive
        url: https://github.com/plk/biber/archive/v2.19/biber-2.19.tar.gz
        sha256: 1c1266bc8adb1637c4c59e23c47d919c5a38da4e53544a3c22c21de4a68fc9fe
      - type: file
        url: https://sourceforge.net/projects/biblatex/files/biblatex-3.19/biblatex-3.19.tds.tgz
        sha256: 7db64bdcdab7bbda00b6065ed5388ab0ff2967006ba07c6006b1701e9858537d
        dest-filename: biblatex.tds.tgz        
  - name: appdata
    buildsystem: simple
    build-commands:
      - install -Dm644 ${FLATPAK_ID}.appdata.xml -t ${FLATPAK_DEST}/share/appdata/
    sources:
      - type: file
        path: org.freedesktop.Sdk.Extension.texlive.appdata.xml
  - name: scripts
    buildsystem: simple
    build-commands:
      - cp *.sh /usr/lib/sdk/texlive/
    sources:
      - type: script
        commands:
          - install -dm755 ${FLATPAK_DEST}
          - cp -ra /usr/lib/sdk/texlive/* ${FLATPAK_DEST}
        dest-filename: install.sh
      - type: script
        commands:
          - export PATH=/usr/lib/sdk/texlive/bin/aarch64-linux:/usr/lib/sdk/texlive/bin:$PATH
        dest-filename: enable.sh
        only-arches:
          - aarch64
      - type: script
        commands:
          - export PATH=/usr/lib/sdk/texlive/bin/x86_64-linux:/usr/lib/sdk/texlive/bin:$PATH
        dest-filename: enable.sh
        only-arches:
          - x86_64
